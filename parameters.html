<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Car Date & Commands</title>
<style>
  body { font-family: Arial; margin:0; padding:20px; background:#f5f5f5; }
  h1 { color:#1976D2; margin-bottom:20px; }
  .param-section { background:#fff; padding:15px 20px; margin-bottom:15px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2);}
  label { display:block; margin-bottom:6px; font-weight:bold; }
  select, input, button { width:100%; padding:8px 10px; margin-bottom:10px; border-radius:6px; border:1px solid #ccc; font-size:14px; }
  button { background:#1976D2; color:#fff; border:none; cursor:pointer; transition: background 0.3s; }
  button:hover { background:#115293; }

  /* Status list */
  #status-list { background:#fff; padding:15px 20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2);}
  #status-list h2 { margin-top:0; color:#1976D2; font-size:18px; }
  #status-list ul { list-style:none; padding:0; margin:0; }
  #status-list li { padding:8px 10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; transition: background 0.3s; }
  #status-list li:last-child { border-bottom:none; }
  #status-list li span { min-width:80px; text-align:center; }

  /* blinking green for expired date */
  .expired {
    animation: blink-green 1s infinite;
  }
  @keyframes blink-green {
    0% { background-color: #ccffcc; }   /* light green */
    50% { background-color: #fff; }
    100% { background-color: #ccffcc; }
  }
</style>
</head>
<body>

<h1>Update Date for Car</h1>

<div class="param-section">
  <label for="car-select">Select Car</label>
  <select id="car-select">
    <option value="">-- Select Car --</option>
  </select>

  <label for="date-picker">Select Date</label>
  <input type="date" id="date-picker">

  <button onclick="sendDateForCar()">Send Date</button>
</div>

<div id="status-list">
  <h2>Cars Status & Availability</h2>
  <ul id="cars-status-ul"></ul>
</div>
<br>
<div class="param-section">
  <h2>Send Command</h2>
  <label for="car-command-select">Select Car</label>
  <select id="car-command-select">
    <option value="">-- Select Car --</option>
  </select>

  <label for="car-command-option">Select Option</label>
  <select id="car-command-option">
    <option value="">-- Select Option --</option>
    <option value="lock">Lock</option>
    <option value="unlock">Unlock</option>
  </select>

  <button onclick="sendCarCommand()">Send Command</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAIlkvwyaF6FPPbXBJDqHwuTS5S3QKG3l8",
  authDomain: "xoxo-store.firebaseapp.com",
  databaseURL: "https://xoxo-store-default-rtdb.firebaseio.com",
  projectId: "xoxo-store",
  storageBucket: "xoxo-store.firebasestorage.app",
  messagingSenderId: "667290233046",
  appId: "1:667290233046:web:dbbc9130ff38b0900f8177",
  measurementId: "G-XMJVCK8KMD"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOT_PATH = "/cars";

const carSelect = document.getElementById("car-select");
const carCommandSelect = document.getElementById("car-command-select");
const statusUl = document.getElementById("cars-status-ul");

function loadCarsList() {
  db.ref(ROOT_PATH).once("value").then(snapshot => {
    const cars = snapshot.val();
    if (!cars) return;

    carSelect.innerHTML = '<option value="">-- Select Car --</option>';
    carCommandSelect.innerHTML = '<option value="">-- Select Car --</option>';
    statusUl.innerHTML = '';

    for (let carId in cars) {
      const car = cars[carId];

      [carSelect, carCommandSelect].forEach(select => {
        const option = document.createElement("option");
        option.value = carId;
        option.textContent = carId;
        select.appendChild(option);
      });

      const li = document.createElement("li");
      li.id = `status-${carId}`;
      const status = car.status || "Unknown";
      const availableOn = car.AvailableOn || "N/A";
      li.innerHTML = `<span>${carId}</span><span>${status}</span><span>${availableOn}</span>`;
      statusUl.appendChild(li);

      checkExpired(li, availableOn);
    }
  });
}

function verifyAdminCode(callback) {
  const code = prompt("Enter Admin Code:");
  if (!code) return alert("Admin code is required!");

  db.ref(`AdminCode/cars`).once("value").then(snapshot => {
    const storedCode = snapshot.val();
    if (code === storedCode) {
      callback();
    } else {
      alert("Invalid Admin Code!");
    }
  }).catch(err => alert("Error verifying code: " + err));
}

function sendDateForCar() {
  const carId = carSelect.value;
  const date = document.getElementById("date-picker").value;
  if (!carId) return alert("Please select a car!");
  if (!date) return alert("Please select a date!");

  verifyAdminCode(() => {
    db.ref(`${ROOT_PATH}/${carId}/AvailableOn`).set(date)
      .then(() => alert(`Date ${date} sent for ${carId}`))
      .catch(err => alert("Error sending date: " + err));
  });
}

function sendCarCommand() {
  const carId = carCommandSelect.value;
  const option = document.getElementById("car-command-option").value;
  if (!carId) return alert("Please select a car!");
  if (!option) return alert("Please select an option!");

  verifyAdminCode(() => {
    db.ref(`${ROOT_PATH}/${carId}/req`).set(option)
      .then(() => alert(`Command "${option}" sent for ${carId}`))
      .catch(err => alert("Error sending command: " + err));
  });
}

function checkExpired(liElement, availableOn) {
  liElement.classList.remove("expired");
  if (!availableOn || availableOn === "N/A") return;

  const today = new Date();
  const carDate = new Date(availableOn + "T23:59:59");
  if (carDate < today) {
    liElement.classList.add("expired");
  }
}

db.ref(ROOT_PATH).on("child_changed", snapshot => {
  const carId = snapshot.key;
  const car = snapshot.val();
  const li = document.getElementById(`status-${carId}`);
  if (li) {
    const status = car.status || "Unknown";
    const availableOn = car.AvailableOn || "N/A";
    li.querySelector("span:nth-child(2)").textContent = status;
    li.querySelector("span:nth-child(3)").textContent = availableOn;

    checkExpired(li, availableOn);
  }
});

loadCarsList();
</script>
<!-- Floating Button -->
<button id="tracking-btn">Go to Tracking</button>

<style>
  #tracking-btn {
    position: fixed;
    bottom: 20px;       /* distance from bottom */
    left: 50%;          /* center horizontally */
    transform: translateX(-50%);
    background-color: #1976D2;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    transition: background 0.3s, transform 0.2s;
    z-index: 1000;
  }

  #tracking-btn:hover {
    background-color: #115293;
    transform: translateX(-50%) translateY(-2px);
  }
</style>

<script>
  document.getElementById("tracking-btn").onclick = function() {
    window.location.href = "Tracking.html";
  }
</script>


</body>
</html>
