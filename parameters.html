<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parameters</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #f5f5f5;
  }
  h1 {
    color: #1976D2;
  }
  .param-section {
    background: #fff;
    padding: 15px 20px;
    margin-bottom: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
  }
  button {
    background-color: #1976D2;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
  }
  button:hover {
    background-color: #115293;
  }
</style>
</head>
<body>

<h1>Parameters</h1>

<div class="param-section">
  <label for="update-interval">Update Interval (seconds)</label>
  <input type="number" id="update-interval" value="5">
</div>

<div class="param-section">
  <label for="map-zoom">Default Map Zoom</label>
  <select id="map-zoom">
    <option value="5">5</option>
    <option value="8" selected>8</option>
    <option value="10">10</option>
    <option value="12">12</option>
    <option value="15">15</option>
  </select>
</div>

<div class="param-section">
  <label for="show-sidebar">Show Sidebar</label>
  <select id="show-sidebar">
    <option value="yes" selected>Yes</option>
    <option value="no">No</option>
  </select>
</div>

<button onclick="saveParameters()">Save</button>

<script>
function saveParameters() {
  const interval = document.getElementById('update-interval').value;
  const zoom = document.getElementById('map-zoom').value;
  const sidebar = document.getElementById('show-sidebar').value;

  // For now, just alert. Later you can save to localStorage or Firebase
  alert(`Saved parameters:\nUpdate Interval: ${interval}s\nMap Zoom: ${zoom}\nShow Sidebar: ${sidebar}`);
}
</script>

  <!-- Add inside <body>, just after #map div -->
<div id="bottomButton">
  <button onclick="goToCarsLocation()">Cars Tracking</button>
</div>

<style>
  #bottomButton {
    position: absolute;
    bottom: 20px; /* distance from bottom */
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }
  #bottomButton button {
    background-color: #1976D2;
    color: #fff;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: background 0.3s, transform 0.2s;
  }
  #bottomButton button:hover {
    background-color: #115293;
    transform: scale(1.05);
  }
</style>

<script>
function goToCarsLocation() {
  window.location.href = "Tracking.html"; // your parameters page
}
</script>
</body>
</html>
